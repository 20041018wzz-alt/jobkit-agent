[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobkit-agent"
version = "1.0.0"
description = "求职材料与面试演练 Agent：结构化个人知识库 + Function Calling + 引用溯源 + 无依据拒答"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wzz" }]
keywords = ["agent", "function-calling", "rag", "personal-assistant", "fastapi", "sse"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobkit-agent = "cli:main"

[tool.setuptools]
py-modules = ["agent", "chat_service", "cli", "config", "evaluate", "knowledge", "llm", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
